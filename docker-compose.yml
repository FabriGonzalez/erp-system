services:
  postgres:
    image: postgres:17
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Fotos de producto en desarrollo: servidor S3-compatible (MinIO dejó de publicar imágenes).
  # Consola en http://localhost:9001 (rustfsadmin / rustfsadmin).
  storage:
    image: rustfs/rustfs:1.0.3
    container_name: erp-storage
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data

  # Crea el bucket con lectura pública (la tienda muestra las fotos por URL fija) y termina.
  storage-init:
    image: amazon/aws-cli:2.37.0
    container_name: erp-storage-init
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://storage:9000 s3api list-buckets > /dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://storage:9000 s3api create-bucket --bucket erp-images 2>/dev/null || true;
      aws --endpoint-url http://storage:9000 s3api put-bucket-policy --bucket erp-images --policy
      '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::erp-images/*\"}]}';
      "

volumes:
  postgres_data:
  storage_data:
