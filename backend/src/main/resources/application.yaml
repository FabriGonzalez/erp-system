spring:
  application:
    name: backend
  # La importación de productos lee el archivo entero en memoria (512 MB en Render gratis).
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  # El esquema lo crean las migraciones de db/migration; Hibernate solo valida que coincida con
  # las entidades. Una base que ya existía sin Flyway (la de desarrollo) se toma como versión 1.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  # SMTP genérico: cambiando las variables sirve cualquier proveedor. Los defaults apuntan a
  # Mailpit de docker-compose. Con timeouts cortos un servidor caído no deja hilos colgados.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  # Fotos de producto (S3-compatible). Los defaults apuntan al contenedor de docker-compose.
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:erp-images}
    access-key: ${STORAGE_ACCESS_KEY:rustfsadmin}
    secret-key: ${STORAGE_SECRET_KEY:rustfsadmin}
    # Base de las URL que ven la tienda y el panel (bucket de lectura pública o CDN delante).
    public-url: ${STORAGE_PUBLIC_URL:http://localhost:9000/erp-images}
  # Mails de la tienda: salen del remitente de la tienda (si el operador lo cargó) o de MAIL_FROM,
  # con el nombre de la tienda como nombre visible. Los
  # links van al dominio de la tienda; en desarrollo, STORE_LINK_SCHEME=http y STORE_LINK_PORT=3000.
  mail:
    from: ${MAIL_FROM:no-reply@erp.local}
  store:
    link-scheme: ${STORE_LINK_SCHEME:https}
    link-port: ${STORE_LINK_PORT:}
    # Client ID de la app de Google Cloud. Vacío = "Continuar con Google" deshabilitado (503).
    google-client-id: ${GOOGLE_CLIENT_ID:}
  platform-admin:
    username: ${ERP_PLATFORM_ADMIN_USERNAME:platform_admin}
    email: ${ERP_PLATFORM_ADMIN_EMAIL:platform@erp.local}
    password: ${ERP_PLATFORM_ADMIN_PASSWORD:}
